<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Arthur Silveira — Software Engineer</title>
  <desc id="description">Banner em tons de roxo e ciano apresentando Arthur Silveira como engenheiro de software focado em full-stack, mobile e inteligência artificial.</desc>
  <defs>
    <linearGradient id="background" x1="50" y1="20" x2="1150" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117" />
      <stop offset="0.48" stop-color="#111827" />
      <stop offset="1" stop-color="#07151C" />
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="60" x2="980" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" />
      <stop offset="0.52" stop-color="#A78BFA" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(195 150) rotate(12) scale(300 230)">
      <stop stop-color="#7C3AED" stop-opacity="0.25" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 180) rotate(165) scale(280 190)">
      <stop stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="320" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="320" fill="url(#background)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <rect width="1200" height="320" fill="url(#glowPurple)" />
    <rect width="1200" height="320" fill="url(#glowCyan)" />

    <path d="M0 280C196 231 351 326 558 276C773 224 922 242 1200 168V320H0V280Z" fill="#7C3AED" fill-opacity="0.055" />
    <path d="M0 298C213 259 391 330 610 292C846 252 1005 268 1200 226V320H0V298Z" fill="#22D3EE" fill-opacity="0.045" />

    <g opacity="0.7">
      <circle cx="1075" cy="63" r="3" fill="#22D3EE" />
      <circle cx="1110" cy="92" r="2" fill="#A78BFA" />
      <circle cx="1024" cy="48" r="2" fill="#A78BFA" />
      <path d="M1019 48L1075 63L1110 92" stroke="url(#accent)" stroke-opacity="0.45" />
    </g>

    <g transform="translate(72 67)">
      <rect x="0" y="0" width="7" height="183" rx="3.5" fill="url(#accent)" />
      <text x="32" y="38" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="3">HELLO, WORLD. I'M</text>
      <text x="30" y="104" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="49" font-weight="800" letter-spacing="-1.2">ARTHUR SILVEIRA</text>
      <text x="32" y="144" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21" font-weight="700" letter-spacing="1.2">SOFTWARE ENGINEER</text>

      <g transform="translate(31 166)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">
        <rect width="102" height="30" rx="15" fill="#7C3AED" fill-opacity="0.18" stroke="#8B5CF6" stroke-opacity="0.48" />
        <text x="51" y="20" text-anchor="middle" fill="#C4B5FD">FULL-STACK</text>
        <rect x="114" width="82" height="30" rx="15" fill="#0891B2" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.45" />
        <text x="155" y="20" text-anchor="middle" fill="#67E8F9">MOBILE</text>
        <rect x="208" width="54" height="30" rx="15" fill="#0D9488" fill-opacity="0.16" stroke="#2DD4BF" stroke-opacity="0.42" />
        <text x="235" y="20" text-anchor="middle" fill="#5EEAD4">AI</text>
      </g>
    </g>

    <g transform="translate(850 65)">
      <rect width="280" height="190" rx="18" fill="#0B1220" fill-opacity="0.88" stroke="#334155" />
      <path d="M0 42H280" stroke="#334155" />
      <circle cx="22" cy="21" r="5" fill="#FB7185" />
      <circle cx="40" cy="21" r="5" fill="#FBBF24" />
      <circle cx="58" cy="21" r="5" fill="#34D399" />
      <text x="140" y="26" text-anchor="middle" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">arthur — zsh</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
        <text x="22" y="73" fill="#22D3EE">➜</text>
        <text x="45" y="73" fill="#F8FAFC">whoami</text>
        <text x="22" y="101" fill="#A78BFA">arthur@github</text>
        <text x="22" y="132" fill="#22D3EE">➜</text>
        <text x="45" y="132" fill="#F8FAFC">current_mission</text>
        <text x="22" y="160" fill="#94A3B8">building useful things</text>
        <rect x="214" y="148" width="8" height="16" rx="1" fill="#22D3EE" />
      </g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="27.25" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1.5" />
</svg>
